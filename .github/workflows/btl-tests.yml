# Runs Between the Lines' tests (tests/between-the-lines/, about 40 minutes) when the page or its tests change.
# Shell steps only, no third-party actions: the runner's own git and Node, and Playwright from npm.
name: Between the Lines tests
on:
  pull_request:
    paths: ['between-the-lines/**', 'tests/between-the-lines/**', '.github/workflows/btl-tests.yml']
  push:
    branches: [main]
    paths: ['between-the-lines/**', 'tests/between-the-lines/**', '.github/workflows/btl-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out
        run: |
          git init -q .
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install Playwright and Chromium
        working-directory: tests
        run: |
          node --version
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the suite
        run: node tests/between-the-lines/btl.test.js
