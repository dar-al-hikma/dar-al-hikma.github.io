# Runs the Takht's tests (tests/takht/) whenever the Takht or its tests change.
# Shell steps only, no third-party actions: the runner's own git and Node, and Playwright from npm.
name: Takht tests
on:
  pull_request:
    paths: ['takht/**', 'tests/takht/**', '.github/workflows/takht-tests.yml']
  push:
    branches: [main]
    paths: ['takht/**', 'tests/takht/**', '.github/workflows/takht-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        run: |
          git init -q .
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install Playwright and Chromium
        working-directory: tests/takht
        run: |
          node --version
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the suites
        working-directory: tests/takht
        run: ./run-all.sh
      - name: Show the failing suites' output
        if: failure()
        working-directory: tests/takht
        run: grep -l '^FAIL' out-*.txt | xargs -r tail -n 80
