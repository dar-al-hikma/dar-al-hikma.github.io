# Runs the Takht's tests (tests/takht/) whenever the Takht or its tests change.
name: Takht tests
on:
  pull_request:
    paths: ['takht/**', 'tests/takht/**', '.github/workflows/takht-tests.yml']
  push:
    branches: [main]
    paths: ['takht/**', 'tests/takht/**', '.github/workflows/takht-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/takht
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: ./run-all.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: takht-test-output
          path: tests/takht/out-*.txt
