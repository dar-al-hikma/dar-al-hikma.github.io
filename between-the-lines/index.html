<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Between the Lines</title>
<style>
  :root{--void:#070A12;--vellum:#EAE3D2;--brass:#E3AA3E;--steel:#7FB6E0}
  html,body{margin:0;background:var(--void);color:var(--vellum)}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;
       font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  main{max-width:34em}
  h1{font:600 1.9em/1.2 Georgia,"Times New Roman",serif;color:var(--brass);margin:0 0 .6em}
  p{margin:0 0 1.4em}
  a{color:var(--steel)}
</style>
</head>
<body>
<main>
  <h1 id="t">Between the Lines</h1>
  <p id="m">Between the Lines is being corrected. It will be back soon.</p>
  <p><a id="b" href="../">Back to the shelf</a></p>
</main>
<script>
// Withdrawn for corrections; the page itself is in the repository's history. The language is the shelf's shared choice.
(function(){
  var TX = {"en": {"t": "Between the Lines", "m": "Between the Lines is being corrected. It will be back soon.", "b": "Back to the shelf"}, "nb": {"t": "Mellom linjene", "m": "Mellom linjene blir rettet og er snart tilbake.", "b": "Tilbake til hylla"}, "es": {"t": "Entre líneas", "m": "Entre líneas se está corrigiendo y volverá pronto.", "b": "Volver a la estantería"}, "fr": {"t": "Entre les lignes", "m": "Entre les lignes est en cours de correction et sera bientôt de retour.", "b": "Retour à l’étagère"}, "de": {"t": "Zwischen den Zeilen", "m": "Zwischen den Zeilen wird gerade korrigiert und ist bald wieder da.", "b": "Zurück zum Regal"}, "zh": {"t": "字里行间", "m": "《字里行间》正在修订，很快就会回来。", "b": "返回书架"}, "ja": {"t": "行間を読む", "m": "「行間を読む」は修正中です。まもなく再公開します。", "b": "本棚に戻る"}};
  var l = null;
  try { l = localStorage.getItem('dah.lang'); } catch (e) {}
  if (!TX[l]) {
    var nav = (navigator.languages || [navigator.language || 'en']).map(function(x){ return String(x).toLowerCase().slice(0, 2); });
    l = 'en';
    for (var i = 0; i < nav.length; i++) { var c = (nav[i] === 'no' || nav[i] === 'nn') ? 'nb' : nav[i]; if (TX[c]) { l = c; break; } }
  }
  var x = TX[l];
  document.documentElement.lang = {en:'en', nb:'nb', es:'es', fr:'fr', de:'de', zh:'zh-Hans', ja:'ja'}[l];
  document.title = x.t; document.getElementById('t').textContent = x.t;
  document.getElementById('m').textContent = x.m; document.getElementById('b').textContent = x.b;
})();
</script>
</body>
</html>
