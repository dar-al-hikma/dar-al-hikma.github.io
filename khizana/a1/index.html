    if (KZ.get('localStorage', 'dah.khizana.m')) KZ.set('localStorage', store, key);
    var html = new TextDecoder().decode(page);
    // replace this document only once it has finished parsing: while the parser is active, open() is ignored
    // and write() would insert the page into this one instead
    function swap() { document.open(); document.write(html); document.close(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(swap, 0); }); else setTimeout(swap, 0);
  }, function () {
    if (!fromLink) { KZ.set('sessionStorage', store, null); KZ.set('localStorage', store, null); }
    say(fromLink ? 'item.badkey' : 'item.locked');
  });
})();
</script>
