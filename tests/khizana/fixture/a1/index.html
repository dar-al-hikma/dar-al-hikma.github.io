  function bytes(s) { return new TextEncoder().encode(s); }

    });
  }
  // The key in the address (#k=…), then the address without it, so it stays out of history.
  function takeKey() {
    var m = /^#k=([A-Za-z0-9_-]{43})$/.exec(location.hash);
    if (location.hash) try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}

})();
